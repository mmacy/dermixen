[package]
name = "signalsmith-sys"
description = "Signalsmith Stretch, the pitch-preserving time-stretcher, vendored as C++ and made callable from Rust."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
links = "dermixen_signalsmith"

# This crate calls into Signalsmith Stretch, which is C++, and that needs
# unsafe code. It is one of the four wrapper crates that may write unsafe code,
# and every other crate in the workspace forbids it. This table repeats the
# workspace lints, because a package that names its own lints inherits none.
[lints.rust]
missing_docs = "warn"
unsafe_code = "allow"

[build-dependencies]
cc = "1"
