[package]
name = "keyfinder-sys"
description = "libkeyfinder, the key detection library used as the scoreboard baseline for musical key, vendored as C++ and made callable from Rust."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
links = "dermixen_keyfinder"

# This crate calls into libkeyfinder, which is C++, and that needs unsafe code.
# It is one of the four wrapper crates that may write unsafe code, and every
# other crate in the workspace forbids it. This table repeats the workspace
# lints, because a package that names its own lints inherits none.
[lints.rust]
missing_docs = "warn"
unsafe_code = "allow"

[dependencies]

[build-dependencies]
cc = "1"
