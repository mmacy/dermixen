[package]
name = "macos-documents-sys"
description = "The documents macOS asks the app to open, such as a .dmx file double-clicked in the Finder, received through the Objective-C runtime and handed to the window as paths."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# This crate calls into the Objective-C runtime, which needs unsafe code. It is
# one of the four wrapper crates that may write unsafe code, and every other
# crate in the workspace forbids it. This table repeats the workspace lints,
# because a package that names its own lints inherits none.
[lints.rust]
missing_docs = "warn"
unsafe_code = "allow"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSAppleEventManager",
    "NSAppleEventDescriptor",
    "NSNotification",
    "NSObject",
    "NSOperation",
    "NSString",
    "NSURL",
    "block2",
    "objc2-core-services",
] }
objc2-app-kit = { version = "0.3", features = ["NSApplication"] }
block2 = "0.6"
