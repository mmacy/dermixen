# The licenses a dependency may carry. `cargo deny check licenses` fails the
# build when a crate in the dependency graph carries a license that is not on
# this list, so a dependency that the GPL-3.0-or-later cannot combine with
# is caught before it is merged. Continuous integration runs the check.

[graph]
all-features = true

[licenses]
allow = [
    "GPL-3.0-or-later",
    "LGPL-3.0",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
