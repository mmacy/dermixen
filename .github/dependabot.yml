# Dependabot opens a pull request when a Cargo dependency, a GitHub Action
# used by the CI workflow, or a Python dependency of the documentation
# toolchain has a newer version. Continuous integration runs on each of
# those pull requests like any other.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
