name: Docs

# Builds the documentation site with MkDocs and publishes it to GitHub Pages
# on every push to main that touches the docs, the site configuration, or the
# Python toolchain, and whenever someone starts the workflow by hand. The
# build is strict, so a broken link or a page missing from the navigation
# fails the run instead of publishing a broken site.

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - pyproject.toml
      - uv.lock
      - .github/workflows/docs.yml
  workflow_dispatch:

# One deployment at a time. A newer push waits for the one before it rather
# than cancelling it, so the site never ends up half deployed.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: uv sync
        run: uv sync --frozen
      - name: uv run mkdocs build --strict
        run: uv run mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
